name: Build and Publish

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon:
          - hassio-ihost-zigbee2mqtt
    steps:
      - uses: actions/checkout@v4

      - name: Determine arch
        id: arch
        run: |
          ARCH_LIST=$(jq -r -c '.arch' ./${{ matrix.addon }}/config.json)
          echo "ARCH_LIST=$ARCH_LIST" >> $GITHUB_OUTPUT
          echo "Found arches: $ARCH_LIST"

      - name: Set build args
        id: args
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "BUILD_ARGS=--no-cache" >> $GITHUB_OUTPUT
          else
            echo "BUILD_ARGS=--no-latest --test" >> $GITHUB_OUTPUT
          fi

      - name: Update image owner in config.json
        run: |
          IMAGE=$(jq -r '.image' ./${{ matrix.addon }}/config.json)
          NEW_IMAGE=$(echo "$IMAGE" | sed "s|ghcr\.io/[^/]*/|ghcr.io/${{ github.repository_owner }}/|")
          jq ".image = \"$NEW_IMAGE\"" ./${{ matrix.addon }}/config.json > ./${{ matrix.addon }}/config.json.tmp
          mv ./${{ matrix.addon }}/config.json.tmp ./${{ matrix.addon }}/config.json
          echo "Updated image: $NEW_IMAGE"

      - name: Prepare addon build files
        working-directory: ${{ matrix.addon }}
        run: |
          cp -R common/rootfs .
          cp common/Dockerfile .
          cp common/build.yaml .

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: home-assistant/builder@2025.11.0
        with:
          args: |
            --armv7 \
            --target ${{ matrix.addon }} \
            ${{ steps.args.outputs.BUILD_ARGS }}

      - name: Cleanup old ghcr.io images (keep last 3)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE="hassio-ihost-zigbee2mqtt-armv7"
          echo "Fetching versions for $PACKAGE..."
          VERSIONS=$(gh api "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions" --paginate 2>/dev/null | jq -c '.[] | {id: .id, tags: .metadata.container.tags}' 2>/dev/null) || true
          
          if [ -z "$VERSIONS" ]; then
            echo "No existing versions found (or first push)"
            exit 0
          fi
          
          echo "$VERSIONS" | while read -r VERSION; do
            echo "$VERSION" >> /tmp/versions.json
          done
          
          TOTAL=$(wc -l < /tmp/versions.json)
          echo "Found $TOTAL versions, keeping last 3"
          
          if [ "$TOTAL" -le 3 ]; then
            echo "Nothing to clean up"
            rm -f /tmp/versions.json
            exit 0
          fi
          
          head -n -3 /tmp/versions.json > /tmp/to_delete.json
          while read -r LINE; do
            ID=$(echo "$LINE" | jq -r '.id')
            TAGS=$(echo "$LINE" | jq -r '.tags | join(", ")')
            echo "Deleting version $ID (tags: $TAGS)"
            gh api -X DELETE "/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions/$ID" 2>/dev/null || true
          done < /tmp/to_delete.json
          
          rm -f /tmp/versions.json /tmp/to_delete.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
